name: CI

on:
  push:
    branches:
      - "**"

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync

      - name: Install Chromium (Ubuntu, with system libs)
        if: matrix.os == 'ubuntu-latest'
        run: uv run playwright install --with-deps chromium

      - name: Install Chromium (Windows)
        if: matrix.os == 'windows-latest'
        run: uv run playwright install chromium

      - name: Run full tox matrix (lint, type, tests)
        if: matrix.os == 'ubuntu-latest'
        run: uv run tox

      - name: Run tests only (Windows)
        if: matrix.os == 'windows-latest'
        run: uv run tox -e py311,py312,py313

      - name: Run tests only, no PDF (macOS)
        if: matrix.os == 'macos-latest'
        run: uv run tox -e py311,py312,py313 -- -m "not pdf"
