repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: Run mypy
        entry: uv run mypy
        language: system
        files: ^src/resume_builder/
        types: [python]
