repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --fix src tests
        language: system
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format src tests
        language: system
        types: [python]

      - id: mypy
        name: Run mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        files: ^(src/resume_builder/|tests/)
        types: [python]
