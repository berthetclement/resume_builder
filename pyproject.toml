[project]
name = "resume-builder"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "clement", email = "clement.berthet013@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
    "markdown-it-py[plugins]>=4.2.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
resume-builder = "resume_builder:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/resume_builder/_version.py"

[dependency-groups]
lint = ["ruff>=0.16.1"]
type = [
    "mypy>=2.3.0",
    "types-pyyaml>=6.0.12.20260815",
]
test = ["pytest>=9.1.1",
    "pytest-cov>=7.1.0"]

dev = [
    {include-group = "lint"},
    {include-group = "type"},
    {include-group = "test"},
    "pre-commit>=4.6.1",
    "tox>=4.58.0",
    "tox-uv>=1.36.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]  # errors, pyflakes, isort, pyupgrade, bugbear, simplify

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["explicit-override"]

[tool.tox]
env_list = ["py311", "py312", "py313", "lint", "type"]

[tool.tox.env_run_base]
description = "Run tests under {base_python}"
dependency_groups = ["test"]
commands = [["pytest"]]

[tool.tox.env.lint]
description = "Run ruff lint + format checks"
dependency_groups = ["lint"]
commands = [
    ["ruff", "check", "src", "tests"],
    ["ruff", "format", "--check", "src", "tests"],
]

[tool.tox.env.type]
description = "Run mypy"
dependency_groups = ["type", "test"]
commands = [["mypy", "src", "tests"]]

[tool.tox.env.py313]
commands = [["pytest", "--cov=resume_builder", "--cov-report=term-missing"]]
